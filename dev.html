<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- ВХОДНОЙ HTML НЕ КЭШИРУЕМ. Скрипты и картинки Vite именует по хешу
         содержимого, их кэшировать можно и нужно; а вот сам html — это список
         актуальных хешей, и стоит браузеру придержать его, как игрок остаётся
         на старой сборке при полностью выложенной новой. Ровно это и вышло:
         «здания не разрушаются» при уже задеплоенных спрайтах руин. -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <!-- viewport-fit=cover — чтобы работал env(safe-area-inset-*): без него отступы
         под «домашнюю полоску»/чёлку iPhone всегда резолвятся в 0 и нижний ряд
         управления в мини-играх перекрывается (см. GamesWrapper.vue) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Ozon Game — DEV (тест)</title>

    <link rel="stylesheet" crossorigin href="./assets/index-qze49CG1.css">
